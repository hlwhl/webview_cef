name: Test if the example app still builds on macOS
on:
  push:
    branches: ["main"]
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"
  pull_request:
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"

jobs:
  main:
    # macos-latest is Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build tools
        run: brew install ninja cmake
      # CEF is downloaded and built by macos/scripts/download_cef.sh, which is
      # invoked automatically via pod install (podspec prepare_command). It
      # produces a universal (arm64 + x86_64) CEF by default — no manual steps
      # needed.
      - run: flutter --version
      - name: Analyze plugin
        run: flutter analyze
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - run: cd example && flutter build macos

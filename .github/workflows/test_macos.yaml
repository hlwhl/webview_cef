name: Test if the example app still builds on macOS
on:
  push:
    branches: ["main"]
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"
  pull_request:
    paths:
      - "common/**"
      - "example/**"
      - "lib/**"
      - "macos/**"
      - "pubspec.yaml"
      - ".github/workflows/test_macos.yaml"

jobs:
  main:
    # macos-latest is Apple Silicon (arm64).
    runs-on: macos-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install build tools
        run: brew install ninja cmake
      # Pre-populate macos/third/cef (headers, framework, wrapper, helper) with
      # the same script the podspec's prepare_command runs, so `pod install`
      # finds it already prepared. The CEF version comes from
      # third/download.cmake — the single source of truth for all platforms.
      - name: Download CEF and build libcef_dll_wrapper
        run: bash macos/scripts/download_cef.sh
      - run: flutter --version
      - name: Analyze plugin
        run: flutter analyze
      - name: Analyze example
        working-directory: example
        run: flutter analyze
      - run: cd example && flutter build macos
